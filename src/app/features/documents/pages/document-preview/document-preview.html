<div class="preview-page-container">
  @if (loading()) {
    <div class="loading-state-box">
      <div class="spinner"></div>
      <p>Loading document preview...</p>
    </div>
  } @else if (currentDocument()) {
    <app-document-preview-shell
      [document]="currentDocument()!"
      [config]="currentConfig()"
      (statusChange)="onStatusChange($event)"
      (delete)="onDelete()"
    ></app-document-preview-shell>
  } @else {
    <div class="not-found-box">
      <span class="material-icons not-found-icon">error_outline</span>
      <h2>Document Not Found</h2>
      <p>The requested document "{{ docNumber() }}" could not be located in your local database.</p>
      <a [routerLink]="['/' + docTypeSlug()]" class="btn-back">
        <span class="material-icons">arrow_back</span>
        <span>Back to {{ currentConfig().pluralName }}</span>
      </a>
    </div>
  }
</div>
