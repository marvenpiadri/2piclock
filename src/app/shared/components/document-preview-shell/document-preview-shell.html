<div class="doc-preview-workspace">
  <!-- Top Preview & Action Toolbar (Hidden in Print) -->
  <header class="preview-toolbar print-hide">
    <div class="toolbar-left">
      <a [routerLink]="'/' + config().routeSegment" class="back-link">
        <span class="material-icons">arrow_back</span>
        <span>{{ config().pluralName }}</span>
      </a>
      <div class="doc-title-lockup">
        <span class="doc-code">{{ document().docNumber }}</span>
        <span class="doc-client-tag">{{ document().client.name }}</span>
      </div>
    </div>

    <!-- Template & Layout Controls -->
    <div class="toolbar-center">
      <!-- Template Switcher Pills -->
      <div class="control-group">
        <span class="control-label">Template:</span>
        <div class="pills-capsule">
          <button
            type="button"
            class="pill-btn"
            [class.active]="selectedTemplate() === 'modern'"
            (click)="setTemplate('modern')"
          >
            Modern
          </button>
          <button
            type="button"
            class="pill-btn"
            [class.active]="selectedTemplate() === 'classic'"
            (click)="setTemplate('classic')"
          >
            Classic
          </button>
          <button
            type="button"
            class="pill-btn"
            [class.active]="selectedTemplate() === 'bold'"
            (click)="setTemplate('bold')"
          >
            Bold
          </button>
          @if (document().docType === 'receipts') {
            <button
              type="button"
              class="pill-btn"
              [class.active]="selectedTemplate() === 'thermal-80mm'"
              (click)="setTemplate('thermal-80mm')"
            >
              80mm Thermal
            </button>
          }
        </div>
      </div>

      <!-- Paper Size Capsule -->
      <div class="control-group">
        <span class="control-label">Paper:</span>
        <div class="pills-capsule">
          <button
            type="button"
            class="pill-btn"
            [class.active]="selectedPaperSize() === 'a4'"
            (click)="setPaperSize('a4')"
          >
            A4
          </button>
          <button
            type="button"
            class="pill-btn"
            [class.active]="selectedPaperSize() === 'letter'"
            (click)="setPaperSize('letter')"
          >
            Letter
          </button>
        </div>
      </div>
    </div>

    <!-- Main Output & Management Actions -->
    <div class="toolbar-right">
      <button type="button" class="btn-action edit-btn" (click)="onEdit()" title="Edit document fields">
        <span class="material-icons btn-icon">edit</span>
        <span>Edit</span>
      </button>

      <button type="button" class="btn-action duplicate-btn" (click)="onDuplicate()" title="Duplicate as new document">
        <span class="material-icons btn-icon">content_copy</span>
        <span>Duplicate</span>
      </button>

      <!-- Status dropdown action -->
      <div class="status-action-box">
        @if (document().status !== 'paid' && document().status !== 'completed') {
          <button
            type="button"
            class="btn-action status-btn mark-paid"
            (click)="updateStatus('paid')"
            title="Mark this document as fully settled"
          >
            <span class="material-icons btn-icon">check_circle</span>
            <span>Mark Paid</span>
          </button>
        } @else {
          <button
            type="button"
            class="btn-action status-btn mark-sent"
            (click)="updateStatus('sent')"
          >
            <span class="material-icons btn-icon">undo</span>
            <span>Mark Sent</span>
          </button>
        }
      </div>

      <button type="button" class="btn-action download-btn" (click)="onDownloadPdf()" title="Save as PDF">
        <span class="material-icons btn-icon">download</span>
        <span>PDF</span>
      </button>

      <button type="button" class="btn-action print-btn" (click)="onPrint()" title="Send to printer">
        <span class="material-icons btn-icon">print</span>
        <span>Print</span>
      </button>

      <button type="button" class="btn-action delete-btn" (click)="confirmDelete()" title="Delete document">
        <span class="material-icons btn-icon">delete_outline</span>
      </button>
    </div>
  </header>

  <!-- Document Sheet Render Area -->
  <main class="preview-stage-container">
    <app-template-renderer
      [document]="document()"
      [templateId]="selectedTemplate()"
      [paperSize]="selectedPaperSize()"
    ></app-template-renderer>
  </main>
</div>
